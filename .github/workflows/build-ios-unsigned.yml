name: Build OurMoney iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare Firebase + Google Sign-In configuration
        env:
          FIREBASE_PLIST_B64: ${{ secrets.FIREBASE_PLIST_B64 }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          GCM_SENDER_ID: ${{ secrets.GCM_SENDER_ID }}
          FIREBASE_PROJECT_ID: 'ourmoney-647b2'
          FIREBASE_STORAGE_BUCKET: 'ourmoney-647b2.firebasestorage.app'
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          bash Scripts/prepare_config.sh \
            "$FIREBASE_PLIST_B64" \
            "$FIREBASE_API_KEY" "$GCM_SENDER_ID" "$FIREBASE_PROJECT_ID" \
            "$FIREBASE_STORAGE_BUCKET" "$FIREBASE_APP_ID" "$GEMINI_API_KEY"

      - name: Validate Firebase configuration
        run: |
          test -s OurMoney/GoogleService-Info.plist
          PLIST_BID=$(/usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' OurMoney/GoogleService-Info.plist)
          CLIENT_ID=$(/usr/libexec/PlistBuddy -c 'Print :CLIENT_ID' OurMoney/GoogleService-Info.plist)
          echo "Firebase plist BUNDLE_ID: $PLIST_BID"
          echo "CLIENT_ID present: $([ -n "$CLIENT_ID" ] && echo yes || echo no)"
          if [ "$PLIST_BID" != "com.ourmoney.app" ]; then
            echo "::warning::GoogleService-Info.plist is registered for '$PLIST_BID', but the app bundle id is com.ourmoney.app. Firebase logs I-COR000008 and still initializes; register com.ourmoney.app in the Firebase project and replace the plist for a perfect match."
          fi
          if [ -z "$CLIENT_ID" ]; then
            echo "::warning::CLIENT_ID empty in GoogleService-Info.plist; Google Sign-In cannot present the Google UI."
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show build settings
        run: |
          set -o pipefail
          xcodebuild -project OurMoney.xcodeproj -scheme OurMoney -configuration Release -sdk iphoneos \
            -showBuildSettings 2>/dev/null | grep -E 'PRODUCT_NAME|FULL_PRODUCT_NAME|WRAPPER_EXTENSION|PRODUCT_BUNDLE_IDENTIFIER|Xcode|SDK version'

      - name: Run unit tests (iPhone simulator)
        run: |
          set -o pipefail
          SIM=$(xcrun simctl list devices available | grep -E 'iPhone' | head -1 | sed -E 's/^[[:space:]]*(.*) \([A-F0-9-]{36}\).*/\1/')
          if [ -z "$SIM" ]; then echo "No iPhone simulator available"; xcrun simctl list devices available; exit 1; fi
          echo "Using simulator: $SIM"
          xcodebuild -project OurMoney.xcodeproj -scheme OurMoney -configuration Debug \
            -destination "platform=iOS Simulator,name=$SIM" \
            -derivedDataPath build/DerivedData test | xcbeautify

      - name: Launch probe — capture host app startup console
        if: failure()
        run: |
          SIM=$(xcrun simctl list devices available | grep -E 'iPhone' | head -1 | sed -E 's/^[[:space:]]*(.*) \([A-F0-9-]{36}\).*/\1/')
          UDID=$(xcrun simctl list devices available | grep -E 'iPhone' | head -1 | grep -oE '[A-F0-9-]{36}')
          echo "Probing launch on: $SIM ($UDID)"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          APP="build/DerivedData/Build/Products/Debug-iphonesimulator/OurMoney.app"
          BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          echo "--- bundle id: $BID ---"
          LOG=$(mktemp /tmp/launch-probe.XXXXXX.log)
          xcrun simctl launch --console-pty "$UDID" "$BID" >"$LOG" 2>&1 &
          LAUNCH_PID=$!
          sleep 25
          kill $LAUNCH_PID 2>/dev/null || true
          echo "===== HOST APP STARTUP CONSOLE ====="
          cat "$LOG" || true
          echo "===== END HOST APP STARTUP CONSOLE ====="
          echo "===== CRASH REPORTS ====="
          CRASH_DIR="$HOME/Library/Logs/DiagnosticReports"
          find "$CRASH_DIR" -name 'OurMoney*' -newer "$LOG" 2>/dev/null | head -3 | while read -r f; do
            echo "--- $f ---"
            sed -n '1,80p' "$f"
          done
          echo "===== END CRASH REPORTS ====="

      - name: Archive (Release, iphoneos, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project OurMoney.xcodeproj -scheme OurMoney -configuration Release -sdk iphoneos \
            -archivePath build/OurMoney.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive | xcbeautify

      - name: Verify archive contents
        run: |
          APP="build/OurMoney.xcarchive/Products/Applications/OurMoney.app"
          test -d "$APP"
          test -f "$APP/Info.plist"
          BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          echo "Bundle identifier: $BID"
          echo "Executable: $NAME"
          test "$BID" = "com.ourmoney.app"
          test "$NAME" = "OurMoney"
          test -f "$APP/GoogleService-Info.plist"

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/OurMoney.xcarchive/Products/Applications/OurMoney.app build/Payload/OurMoney.app
          cd build
          zip -qry OurMoney-unsigned.ipa Payload
          ls -lh OurMoney-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: OurMoney-unsigned-IPA
          path: build/OurMoney-unsigned.ipa
          if-no-files-found: error
